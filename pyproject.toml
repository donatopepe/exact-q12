[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exactq12"
version = "0.1.0"
description = "Exact Q12 symbolic quantum circuit simulator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
exactq12 = "exactq12.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
