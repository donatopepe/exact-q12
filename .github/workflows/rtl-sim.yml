name: rtl-sim

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  iverilog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Run RTL simulations
        run: make -C rtl sim
